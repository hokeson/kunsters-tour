name: Restore app.js
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-app-js.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good app.js
        run: |
          git checkout cd5939e796eb0260d4ad4632581a225fef7967c7 -- docs/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.js
          git diff --cached --quiet || git commit -m "Restore docs/app.js to known-good version"
          git push
