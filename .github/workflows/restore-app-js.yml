name: Deploy Historic statistics v2
on:
  push:
    paths:
      - '.github/workflows/restore-app-js.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Historic statistics v2
        run: |
          set -euo pipefail
          python3 scripts/apply-historic-v2.py
          node --check docs/app.js
          python3 -m json.tool docs/data/guests.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app.js docs/style.css docs/index.html docs/data/guests.json
          git diff --cached --quiet || git commit -m "Apply Historic statistics v2 foundation"
          git push
