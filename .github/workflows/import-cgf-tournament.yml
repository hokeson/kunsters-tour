name: Import CGF tournament
on:
  workflow_dispatch:
    inputs:
      tournament_id:
        description: CGF Tournament ID
        required: true
      category_id:
        description: CGF Category ID
        required: true
  push:
    branches: [main]
    paths:
      - data/import-request.json
concurrency:
  group: import-cgf
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Select tournaments
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ inputs.tournament_id }} ${{ inputs.category_id }}" > /tmp/list.txt
          else
            jq -r 'if .imports then .imports[] | "\(.tournament_id) \(.category_id)" else "\(.tournament_id) \(.category_id)" end' data/import-request.json > /tmp/list.txt
          fi
          sed -i 's/[^0-9 ]//g' /tmp/list.txt
          cat /tmp/list.txt
          [ -s /tmp/list.txt ] || { echo "Missing tournament_id or category_id"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Import
        run: |
          FAIL=0
          while read -r T C; do
            [ -z "$T" ] && continue
            echo "=== Tournament $T category $C"
            node scripts/import-cgf.js --tournament "$T" --category "$C" || { echo "FAILED $T"; FAIL=1; }
          done < /tmp/list.txt
          echo "fail=$FAIL" >> "$GITHUB_ENV"
      - name: Commit imported data
        run: |
          git config user.name "kunsters-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/imports
          git diff --cached --quiet || git commit -m "Import CGF tournaments"
          git pull --rebase
          git push
      - name: Report failures
        if: env.fail == '1'
        run: exit 1
