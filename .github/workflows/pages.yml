name: Publish website
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - data/**
      - scripts/build-index.cjs
      - .github/workflows/pages.yml
  workflow_run:
    workflows: ["Import CGF tournament"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r docs/. _site/
          cp -r data/imports _site/data/imports
          cp data/almanac.json _site/data/almanac.json
          if [ -d data/seasons ]; then cp -r data/seasons _site/data/seasons; fi
          node scripts/build-index.cjs _site/data/imports
          for f in _site/img/*.b64; do [ -e "$f" ] && base64 -d "$f" > "${f%.b64}" && rm "$f"; done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
